{% extends "exercises/base.html" %}

{% block title %}Axon-Pose | Editar Consejo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-4">
            <div class="card-header bg-primary text-white p-4 border-0">
                <h4 class="fw-bold mb-0"><i class="fas fa-edit me-2"></i> Editar Consejo Global</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Título del consejo</label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Recomendación</label>
                        {{ form.message }}
                    </div>
                    <div class="form-check mb-4">
                        {{ form.is_active }}
                        <label class="form-check-label">Publicar ahora</label>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 rounded-pill">Guardar cambios</button>
                        <a href="{% url 'doctor_dashboard' %}" class="btn btn-light flex-grow-1 rounded-pill">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const inputs = document.querySelectorAll("input, textarea");
    inputs.forEach(input => {
        if (input.type === "checkbox") return;
        input.classList.add("form-control");
    });
});
</script>
{% endblock %}
